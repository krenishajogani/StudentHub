<!DOCTYPE html>
<html>

<head>
  
    <title>StudentHub Login</title>

  
  
    <link rel="stylesheet" href="style.css">
        
</head>

<body>


    <!-- Header -->

    <header class="header">

        <!-- StudentHub Logo -->
    <div class="logo">

        <img src="aca.png"
             width="50"
             height="50"
             alt="StudentHub Logo">

        <h2>STUDENTHUB</h2>

    </div>
 <button id="themeToggle">🌙 Dark Mode</button>
    </header>


    <!-- Login Form -->

    <main class="home-main">

    <div class="login-box">

        <h2 class="portal-name">
            Student Login
        </h2>

     <form action="login.php" method="POST">

    <label for="email"><b>Email</b></label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter Email"
        required
    >

    <label for="password"><b>Password</b></label>
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter Password"
        required
    >

    <input
        type="submit"
        value="Login"
        class="open-btn"
    >

</form> 
        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</main>


    <!-- Footer -->

    <div class="footer">

        <p>
            © 2026 StudentHub. All Rights Reserved.
        </p>

    </div>

 <script src="script.js"></script>

</body>

</html>
